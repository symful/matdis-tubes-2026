execution_plan:
  start_node: 0
  goal_node: 7
  algorithm: pathfinding
  events:
    - {step: 0, type: "BLOCK_EDGE", entity_id: "S1", target_edge: [9, 10], description: "Tumpukan sampah S1 menutup penuh Jl. Mista Raya (ruas 9-10) sejak awal."}
    - {step: 0, type: "BLOCK_NODE", entity_id: "K2", target_node: 9, description: "Kobra diam K2 menghinggap di Simpang Kemuning Raya (node 9) sejak awal."}
    - {step: 0, type: "DYNAMIC_EDGE_WEIGHT", entity_id: "F1", target_edge: [4, 5], new_weight: 6.45, description: "Genangan banjir di Jl. Kampung Rawa Kalong (ruas 4-5) melonjakkan waktu tempuh 3 kali, masih bisa dilalui jalan kaki."}
    - {step: 2, type: "BLOCK_NODE", entity_id: "K1", target_node: 3, description: "Kelompok kobra K1 (6 ekor) bergerombol di Simpang Taman Raya (node 3); koridor utama terputus."}
    - {step: 3, type: "UNBLOCK_EDGE", entity_id: "S1", target_edge: [9, 10], description: "Warga dan tim rescue membersihkan tumpukan sampah S1; Jl. Mista Raya dibuka kembali."}
    - {step: 4, type: "UNBLOCK_NODE", entity_id: "K2", target_node: 9, description: "Tim rescue mengusir kobra diam K2 dari Simpang Kemuning Raya (node 9)."}
    - {step: 5, type: "UNBLOCK_NODE", entity_id: "K1", target_node: 3, description: "Kelompok kobra K1 ditangani tim rescue; Simpang Taman Raya (node 3) aman kembali."}
    - {step: 6, type: "DYNAMIC_EDGE_WEIGHT", entity_id: "F1", target_edge: [4, 5], new_weight: 2.15, description: "Banjir surut; Jl. Kampung Rawa Kalong (ruas 4-5) kembali normal."}

