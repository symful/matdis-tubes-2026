case_id: "case_01_kobra_banjir"
title: "Kasus 1: Kobra Banjir Path Finding"
author: "Kelas B (033, 051, 053, 055), Kota Bekasi, Januari 2020"
sumber:
  - "Kompas.com (2020): Puluhan Ular Bermunculan Selama Banjir di Kota Bekasi"
  - "Okezone.com (2020): Banjir Surut, Warga Bekasi Diteror Ular dan Buaya"
  - "Trans TV (2020): Trauma Usai Banjir Warga Dikejutkan Kobra"
data_source: "OpenStreetMap (Nominatim + OSRM foot), diambil dengan scripts/fetch_route_maps.py"

# ---------------------------------------------------------------------------
# Bagian 1: Ruang lingkup soal (ICPC-style scoping)
# ---------------------------------------------------------------------------
problem:
  statement: >
    Banjir melanda Komplek Perumahan Green Residence 1, Jalan Dahlia, Karang Satria,
    Tambun Utara, Kota Bekasi (awal Januari 2020). Sarang kobra terendam sehingga kobra
    keluar ke permukiman. Warga yang berjalan kaki dari Titik A (Perumahan Karangsatria
    Green Residence) ke Titik B (Kantor Desa Karang Satria, plus minus 1,2 km, plus minus
    15 menit) harus memilih jalur aman yang tidak melewati kelompok kobra, kobra diam,
    dan tumpukan sampah, di tengah genangan banjir yang membengkakkan waktu tempuh.
  objectives:
    - "Mengidentifikasi penyebab masuknya kobra ke permukiman dengan diagram fishbone (Ishikawa), dua varian: kategori lahir dari kasus (non-6M) dan kategori baku 6M."
    - "Menentukan jalur aman dari Titik A ke Titik B: lintasan berbobot waktu minimum yang tidak melewati blocker aktif."
    - "Menunjukkan analisis top-bottom: masalah utama diturunkan ke kategori besar lalu ke sub-penyebab lapangan."
  assumptions:
    snakes:
      movable: true
      model: "Okupansi dinyatakan sebagai window from_step..to_step pada satu node. Kobra bergerombol (K1) berpindah node mengikuti window; kobra diam (K2) menempati satu node sampai diusir rescue."
    trash:
      movable: false
      clearable: true
      model: "Tumpukan sampah statis menutup penuh satu ruas sejak awal hingga clear_step; setelah dibersihkan ruas dibuka kembali."
    flood:
      movable: false
      effect: "weight_surge"
      surge_factor: 3.0
      passable: true
      model: "Genangan statis dalam horizon soal. Ruas tergenang tetap bisa dilalui jalan kaki, tetapi bobot waktu membengkak surge_factor kali."
    walking:
      speed_kmh: 4.5
      unit_time: "menit"
      unit_distance: "meter"
      step_minutes: 1
  constraints:
    max_nodes: 50
    max_edges: 120
    horizon_steps: 12
    time_weight_range_menit: [0.1, 99.0]
    distance_range_m: [10, 800]
    max_blockers: 5
    start_not_goal: true
    graph_connected_awal: true
    guarantee_rute_awal: true
    ruas_tertutup_total: "BLOCK_EDGE memutus ruas dua arah"
  input_format: >
    File YAML skenario: nodes (id, label, pos, lat, lon), edges (from, to, street,
    weight dalam menit, distance_m, direction, flooded), problem (statement,
    objectives, assumptions, constraints), fishbone, entities (snakes, trash, flood),
    execution_plan (start_node, goal_node, events). Bobot weight = waktu tempuh
    jalan kaki dalam menit pada kecepatan 4,5 km/jam.
  output_format: >
    Rute aman: urutan node dari start ke goal, total menit, total meter, dan daftar
    id blocker yang dihindari. Jika goal tidak terjangkau pada keadaan aktif,
    keluaran = TIDAK ADA RUTE AMAN (path kosong, cost = infinity).
  clarifications:
    - "Apakah kobra bisa bergerak? Ya. K1 bergerak mengikuti window node (datang dari sarang yang kebanjiran, ditangani rescue di akhir window). K2 diam (statis) sampai diusir."
    - "Apakah sampah bisa bergerak? Tumpulannya statis, tetapi bisa dibersihkan (clearable). Sebelum clear_step ruas terblokir penuh, sesudahnya ruas dibuka kembali."
    - "Apakah air banjir naik atau turun? Dalam horizon soal genangan statis, lalu surut pada step 6 (event restore bobot). Genangan hanya membengkakkan bobot, bukan blocker total."
    - "Apakah goal selalu reachable? Tidak dijamin. Jika semua jalur ke goal terblokir, keluaran TIDAK ADA RUTE AMAN. Pada kasus ini step 2 dan step 3 memang tidak ada rute aman."
    - "Ruas gang terakhir ke Kantor Desa (edge 6-7) adalah satu-satunya akses ke B menurut data OSM; tidak ada bypass. Blocker di ruas itu memutus B."
    - "Out of scope: tidak ada simulasi waktu kontinu. Efek blocker berlaku sejak event ditembakkan hingga di-unblock; solver menghitung ulang rute dari Titik A setiap event (model keadaan per event, bukan time-expanded)."

# ---------------------------------------------------------------------------
# Bagian 2: Fishbone (Ishikawa), dua varian seperti yang diminta tugas
# ---------------------------------------------------------------------------
fishbone:
  non6m_risk_kobra:
    problem: "Risiko kobra masuk permukiman akibat banjir (kategori lahir dari kasus)"
    categories:
      - {name: "Pemicu Banjir", causes: ["Sarang kobra terendam banjir", "Air setinggi pinggang orang dewasa", "Banjir meluas ke permukiman"]}
      - {name: "Pergerakan Kobra", causes: ["Kobra keluar dari sarang", "Bergerak ke tempat yang lebih kering", "Bergerombol di titik tertentu"]}
      - {name: "Kondisi Habitat", causes: ["Hunian berdekatan dengan habitat kobra", "Semak di sekitar rumah jarang dirawat", "Sarang kebanjiran"]}
      - {name: "Sumber Makanan", causes: ["Tikus hidup di tumpukan sampah", "Tumpukan barang warga jadi tempat persembunyian"]}
      - {name: "Tempat Berlindung", causes: ["Tumpukan sampah dan barang", "Rumah warga lebih kering dari luar"]}
      - {name: "Akses ke Rumah", causes: ["Celah ventilasi dan saluran air terbuka", "Drainase tidak tertutup", "Gapura dan pintu terbuka"]}
  path_6m:
    problem: "Jalur aman A ke B sulit ditentukan"
    categories:
      MAN: ["Warga belum tahu rute", "Warga salah pilih ruas"]
      MACHINE: ["Peta tidak menandai ular", "Peta tidak menandai sampah"]
      METHOD: ["Blocker tidak disaring", "Hanya mengutamakan jarak"]
      MATERIAL: ["Sampah menutup jalan", "Tumpukan jadi blocker"]
      ENVIRONMENT: ["Kobra berkelompok", "Ular diam jadi blocker"]
      MEASUREMENT: ["Titik blocker tidak pasti", "Status ruas belum jelas"]
  risk_6m:
    problem: "Risiko kobra masuk permukiman akibat banjir"
    categories:
      MAN: ["Hunian dekat habitat", "Buang sampah terbuka"]
      MACHINE: ["Celah rumah terbuka", "Drainase tidak tertutup"]
      METHOD: ["Sampah tidak terkelola", "Semak jarang dirawat"]
      MATERIAL: ["Tumpukan barang", "Tikus sebagai mangsa"]
      ENVIRONMENT: ["Sarang kebanjiran", "Rumah lebih kering"]
      MEASUREMENT: ["Celah masuk tidak didata", "Titik rawan tidak dipeta"]

# ---------------------------------------------------------------------------
# Bagian 3: Entitas lapangan (deklarasi mobilitas + window okupansi)
# ---------------------------------------------------------------------------
entities:
  snakes:
    - id: "K1"
      label: "Kelompok kobra di Simpang Taman Raya"
      kind: "kelompok"
      group_size: 6
      movable: true
      windows:
        - {from_step: 2, to_step: 4, node: 3}
      note: "Datang dari sarang di kawasan Rawa Kalong yang kebanjiran; ditangani tim rescue pada step 5."
    - id: "K2"
      label: "Kobra diam di Simpang Kemuning Raya"
      kind: "tunggal"
      group_size: 1
      movable: false
      windows:
        - {from_step: 0, to_step: 3, node: 9}
      note: "Diam di dekat tumpukan sampah; diusir tim rescue pada step 4."
  trash:
    - id: "S1"
      label: "Tumpukan sampah di Jl. Mista Raya"
      edge: [9, 10]
      coverage: "full"
      movable: false
      clearable: true
      clear_step: 3
      note: "Dibersihkan warga bersama tim rescue pada step 3."
  flood:
    - id: "F1"
      label: "Genangan banjir di Jl. Kampung Rawa Kalong"
      submerged_edges: [[4, 5]]
      depth_cm: 80
      surge_factor: 3.0
      passable: true
      window: {from_step: 0, to_step: 5}
      note: "Banjir surut pada step 6, bobot ruas kembali normal."

# ---------------------------------------------------------------------------
# Bagian 4: Graf jalan dari OpenStreetMap (kurasi manual dari hasil fetch)
