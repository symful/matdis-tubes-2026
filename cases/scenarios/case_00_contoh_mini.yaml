      from_step: 0
      to_step: 2
execution_plan:
  start_node: 0
  goal_node: 5
  algorithm: pathfinding
  events:
  - step: 0
    type: BLOCK_EDGE
    entity_id: S1
    target_edge:
    - 2
    - 4
    description: Sampah menutup Jl. I.
  - step: 0
    type: DYNAMIC_EDGE_WEIGHT
    entity_id: F1
    target_edge:
    - 1
    - 3
    new_weight: 9
    description: Genangan membengkakkan Jl. D tiga kali.
  - step: 1
    type: BLOCK_NODE
    entity_id: K1
    target_node: 3
    description: Kobra bergerombol di P3.
  - step: 2
    type: UNBLOCK_EDGE
    entity_id: S1
    target_edge:
    - 2
    - 4
    description: Sampah Jl. I dibersihkan.
  - step: 3
    type: UNBLOCK_NODE
    entity_id: K1
    target_node: 3
    description: Kobra diusir dari P3.
  - step: 3
    type: DYNAMIC_EDGE_WEIGHT
    entity_id: F1
    target_edge:
    - 1
    - 3
    new_weight: 3
    description: Banjir surut, Jl. D normal.
sample:
  note: Rute awal 7 menit, step 1 tidak ada rute, step 2 memutar 10 menit, step 3 kembali 7 menit.
