  title: 'Contoh Mini: Graf Abstrak dari SOAL'
  description: Contoh kecil dari SOAL untuk memeriksa format masukan dan keluaran. Enam simpul, sembilan
    ruas, satu kobra, satu sampah, dan satu genangan.
